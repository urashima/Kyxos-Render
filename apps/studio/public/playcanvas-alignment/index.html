<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyxos Studio · PlayCanvas Alignment Acceptance</title><style>:root{font-family:Inter,ui-sans-serif,system-ui;background:#0d1117;color:#dce5ef}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}.app{height:100%;display:grid;grid-template-rows:48px 1fr 220px}.top{display:flex;align-items:center;gap:10px;padding:0 14px;background:#151b23;border-bottom:1px solid #2b3440}.top b{color:#fff}.pill{font-size:12px;padding:4px 8px;border:1px solid #3a4655;border-radius:999px;color:#9ed0ff}.main{min-height:0;display:grid;grid-template-columns:310px 1fr 360px}.panel{min-width:0;min-height:0;background:#111821;border-right:1px solid #2b3440;overflow:auto}.panel:last-child{border-right:0;border-left:1px solid #2b3440}.head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:6px;padding:9px;background:#171f29;border-bottom:1px solid #2b3440}.head strong{margin-right:auto}.btn,input,select{background:#202a36;color:#dce5ef;border:1px solid #3a4655;border-radius:5px;padding:6px 8px}.btn{cursor:pointer}.btn:hover{background:#2b3847}.tree{padding:6px}.row{height:28px;display:flex;align-items:center;gap:5px;border-radius:4px;user-select:none}.row:hover{background:#1d2834}.row.sel{background:#19558a}.row.drop{outline:1px solid #6cb8ff}.tw{width:18px;text-align:center;cursor:pointer}.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mini{font-size:11px;opacity:.7}.viewport{display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#233247,#10151d 65%);position:relative}.viewport:before{content:'';width:280px;height:280px;border-radius:20px;transform:rotate(30deg);background:linear-gradient(145deg,#48647d,#1c2a39);box-shadow:0 30px 90px #0008,inset 0 0 0 1px #ffffff18}.viewport .hint{position:absolute;bottom:20px;background:#101722cc;border:1px solid #344150;padding:8px 12px;border-radius:7px;font-size:12px}.section{border-bottom:1px solid #2b3440}.section h3{margin:0;padding:10px;background:#171f29;font-size:13px}.field{display:grid;grid-template-columns:120px 1fr;gap:8px;align-items:center;padding:7px 10px;font-size:12px}.field small{color:#8292a5}.mixed{font-style:italic;color:#ffcc7a}.assets{min-height:0;background:#0f151d;border-top:1px solid #2b3440;display:grid;grid-template-rows:42px 1fr}.assetbar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#171f29}.assetbody{min-height:0;display:grid;grid-template-columns:210px 1fr 300px}.folders,.tasks{overflow:auto;border-right:1px solid #2b3440;padding:8px}.tasks{border-right:0;border-left:1px solid #2b3440}.assetview{overflow:auto;padding:10px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}.card{border:1px solid #344150;background:#151d27;border-radius:7px;padding:8px;cursor:pointer}.card:hover,.card.sel{border-color:#63b3ff}.thumb{height:58px;border-radius:5px;background:linear-gradient(135deg,#2c3b4f,#17202a);display:grid;place-items:center;font-size:24px}.list .card{display:grid;grid-template-columns:36px 1fr 100px 150px;align-items:center;margin-bottom:4px}.list .thumb{height:30px}.muted{color:#8292a5}.task{padding:7px;border-bottom:1px solid #27313d;font-size:12px}.bar{height:4px;background:#293545;border-radius:4px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:#54a9f7}.menu{position:fixed;z-index:9;background:#202a36;border:1px solid #465568;border-radius:6px;padding:4px;min-width:170px;box-shadow:0 10px 40px #0008}.menu button{display:block;width:100%;text-align:left;background:none;color:#fff;border:0;padding:7px;border-radius:4px}.menu button:hover{background:#344457}.status{margin-left:auto;font-size:12px;color:#80d6a5}</style></head><body><div class="app"><div class="top"><b>Kyxos Studio · PlayCanvas Alignment</b><span class="pill">Hierarchy complete</span><span class="pill">Schema Inspector complete</span><span class="pill">Asset Workspace complete</span><span class="status" id="status">Ready</span></div><div class="main"><section class="panel"><div class="head"><strong>Hierarchy</strong><button class="btn" id="add">＋</button><button class="btn" id="copy">Copy</button><button class="btn" id="paste">Paste</button></div><div class="tree" id="tree" tabindex="0"></div></section><main class="viewport"><div class="hint">Drag hierarchy rows · Shift range select · Ctrl/Cmd multi-select · F2 rename · Delete · Ctrl/Cmd C/X/V</div></main><section class="panel" id="inspector"><div class="head"><strong>Schema Inspector</strong><button class="btn" id="reset">Reset</button><button class="btn" id="restore">Restore</button></div><div id="fields"></div></section></div><section class="assets"><div class="assetbar"><strong>Asset Workspace</strong><button class="btn" id="newFolder">New Folder</button><button class="btn" id="importBtn">Import</button><input id="search" placeholder="Search assets"><select id="filter"><option value="">All types</option><option>model</option><option>texture</option><option>material</option><option>animation</option></select><button class="btn" id="toggleView">Grid/List</button><button class="btn" id="trash">Trash</button></div><div class="assetbody"><div class="folders" id="folders"></div><div class="assetview"><div id="assetView" class="grid"></div></div><div class="tasks"><b>Import Queue</b><div id="tasks"></div></div></div></section></div><input type="file" id="file" multiple hidden><script>const $=s=>document.querySelector(s),status=t=>{$('#status').textContent=t;setTimeout(()=>$('#status').textContent='Ready',1200)};let id=20,selected=['root'],anchor='root',collapsed=new Set(),clip=null,cut=false,isolate=null;const nodes=[{id:'root',parent:null,name:'Scene',type:'empty',visible:true,locked:false,position:[0,0,0],rotation:[0,0,0],scale:[1,1,1]},{id:'cam',parent:'root',name:'Main Camera',type:'camera',visible:true,locked:false,position:[0,2,6],rotation:[-10,0,0],scale:[1,1,1],fov:50,near:.1,far:1000},{id:'lights',parent:'root',name:'Lighting',type:'empty',visible:true,locked:false,position:[0,0,0],rotation:[0,0,0],scale:[1,1,1]},{id:'sun',parent:'lights',name:'Key Light',type:'light',visible:true,locked:false,position:[2,4,3],rotation:[45,20,0],scale:[1,1,1],intensity:3,color:'#fff4df'},{id:'model',parent:'root',name:'Robot.glb',type:'model',visible:true,locked:false,position:[0,0,0],rotation:[0,0,0],scale:[1,1,1],material:'mat1'},{id:'mesh',parent:'model',name:'Body',type:'mesh',visible:true,locked:false,position:[0,0,0],rotation:[0,0,0],scale:[1,1,1],material:'mat1'}];const children=p=>nodes.filter(n=>n.parent===p),subtree=x=>{const out=[];(function v(k){out.push(k);children(k).forEach(c=>v(c.id))})(x);return out},visible=()=>{const out=[];(function v(p,d){children(p).forEach(n=>{out.push([n,d]);if(!collapsed.has(n.id))v(n.id,d+1)})})(null,0);return out};function renderTree(){const rows=visible();$('#tree').innerHTML=rows.map(([n,d])=>`<div class="row ${selected.includes(n.id)?'sel':''}" draggable="true" data-id="${n.id}" style="padding-left:${d*15}px"><span class="tw">${children(n.id).length?(collapsed.has(n.id)?'▸':'▾'):''}</span><span>${n.type==='camera'?'📷':n.type==='light'?'💡':n.type==='model'?'📦':n.type==='mesh'?'◆':'◇'}</span><span class="name">${n.name}</span><span class="mini">${n.locked?'🔒':''}${!n.visible?'◌':''}</span></div>`).join('');document.querySelectorAll('.row').forEach(r=>{r.onclick=e=>selectRow(r.dataset.id,e);r.ondblclick=()=>renameNode(r.dataset.id);r.querySelector('.tw').onclick=e=>{e.stopPropagation();collapsed.has(r.dataset.id)?collapsed.delete(r.dataset.id):collapsed.add(r.dataset.id);renderTree()};r.ondragstart=e=>e.dataTransfer.setData('text/plain',r.dataset.id);r.ondragover=e=>{e.preventDefault();r.classList.add('drop')};r.ondragleave=()=>r.classList.remove('drop');r.ondrop=e=>{e.preventDefault();const from=e.dataTransfer.getData('text/plain'),to=r.dataset.id;if(from!==to&&!subtree(from).includes(to)){nodes.find(n=>n.id===from).parent=to;status('Node moved');renderTree()}};r.oncontextmenu=e=>context(e,r.dataset.id)});renderInspector()}function selectRow(x,e){const ids=visible().map(v=>v[0].id);if(e.shiftKey){const a=ids.indexOf(anchor),b=ids.indexOf(x);selected=ids.slice(Math.min(a,b),Math.max(a,b)+1)}else if(e.ctrlKey||e.metaKey){selected=selected.includes(x)?selected.filter(i=>i!==x):[...selected,x];anchor=x}else{selected=[x];anchor=x}renderTree()}function renameNode(x){const n=nodes.find(n=>n.id===x),name=prompt('Rename',n.name);if(name){n.name=name;status('Renamed');renderTree()}}function addNode(type='empty',parent=selected[0]||'root'){const n={id:'n'+id++,parent,name:type==='camera'?'Camera':type==='light'?'Light':'Empty',type,visible:true,locked:false,position:[0,0,0],rotation:[0,0,0],scale:[1,1,1]};if(type==='camera')Object.assign(n,{fov:50,near:.1,far:1000});if(type==='light')Object.assign(n,{intensity:1,color:'#ffffff'});nodes.push(n);selected=[n.id];renderTree()}function duplicate(){const roots=selected.filter(x=>!selected.some(y=>y!==x&&subtree(y).includes(x)));const made=[];roots.forEach(root=>{const map={};subtree(root).forEach(old=>map[old]='n'+id++);subtree(root).forEach(old=>{const src=nodes.find(n=>n.id===old),n=structuredClone(src);n.id=map[old];n.parent=old===root?src.parent:map[src.parent];n.name=old===root?src.name+' Copy':src.name;nodes.push(n);made.push(n.id)})});selected=made;renderTree()}function remove(){const doomed=new Set(selected.flatMap(subtree));for(let i=nodes.length-1;i>=0;i--)if(doomed.has(nodes[i].id)&&nodes[i].id!=='root')nodes.splice(i,1);selected=['root'];renderTree()}function context(e,x){e.preventDefault();selected=[x];renderTree();document.querySelector('.menu')?.remove();const m=document.createElement('div');m.className='menu';m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';[['Rename',()=>renameNode(x)],['Duplicate',duplicate],['Cut',()=>{clip=structuredClone(selected);cut=true}],['Copy',()=>{clip=structuredClone(selected);cut=false}],['Paste',paste],['Add Empty',()=>addNode('empty',x)],['Add Camera',()=>addNode('camera',x)],['Add Light',()=>addNode('light',x)],['Lock / Unlock',()=>{const n=nodes.find(n=>n.id===x);n.locked=!n.locked;renderTree()}],['Hide / Show',()=>{const n=nodes.find(n=>n.id===x);n.visible=!n.visible;renderTree()}],['Isolate',()=>{isolate=x;nodes.forEach(n=>n.visible=subtree(x).includes(n.id));renderTree()}],['Clear Isolate',()=>{isolate=null;nodes.forEach(n=>n.visible=true);renderTree()}],['Delete',remove]].forEach(([t,f])=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{f();m.remove()};m.append(b)});document.body.append(m);setTimeout(()=>document.addEventListener('click',()=>m.remove(),{once:true}))}function paste(){if(!clip)return;duplicate();if(cut){const old=[...clip];selected=old;remove();cut=false}status('Pasted')}$('#tree').onkeydown=e=>{const ids=visible().map(v=>v[0].id),i=ids.indexOf(selected.at(-1));if(e.key==='ArrowDown'&&i<ids.length-1){selected=[ids[i+1]];anchor=ids[i+1]}else if(e.key==='ArrowUp'&&i>0){selected=[ids[i-1]];anchor=ids[i-1]}else if(e.key==='ArrowRight')collapsed.delete(selected[0]);else if(e.key==='ArrowLeft')collapsed.add(selected[0]);else if(e.key==='Home')selected=[ids[0]];else if(e.key==='End')selected=[ids.at(-1)];else if(e.key==='F2')renameNode(selected[0]);else if(e.key==='Delete')remove();else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='c'){clip=structuredClone(selected);cut=false}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='x'){clip=structuredClone(selected);cut=true}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='v')paste();renderTree()};$('#add').onclick=()=>addNode();$('#copy').onclick=()=>{clip=structuredClone(selected);cut=false};$('#paste').onclick=paste;const schema=[['Name','name','text'],['Position','position','vec'],['Rotation','rotation','vec'],['Scale','scale','vec'],['Visible','visible','check'],['Material','material','asset'],['FOV','fov','number'],['Near','near','number'],['Far','far','number'],['Intensity','intensity','number'],['Color','color','color']];const base=new Map();function renderInspector(){const targets=selected.map(x=>nodes.find(n=>n.id===x)).filter(Boolean);$('#fields').innerHTML='<div class="section"><h3>Generated from schema · '+targets.length+' selected</h3>'+schema.filter(([,k])=>targets.some(t=>k in t)).map(([label,key,type])=>{const vals=targets.map(t=>JSON.stringify(t[key])),mixed=!vals.every(v=>v===vals[0]),val=mixed?'':targets[0][key];let input=type==='check'?`<input data-key="${key}" type="checkbox" ${!mixed&&val?'checked':''}>`:type==='vec'?`<input data-key="${key}" value="${mixed?'':val.join(', ')}" placeholder="${mixed?'— Mixed Value —':''}">`:type==='asset'?`<select data-key="${key}"><option value="">None</option>${assets.filter(a=>a.kind==='material'&&!a.deleted).map(a=>`<option ${a.id===val?'selected':''} value="${a.id}">${a.name}</option>`).join('')}</select>`:`<input data-key="${key}" type="${type}" value="${mixed?'':val??''}" placeholder="${mixed?'— Mixed Value —':''}">`;return `<div class="field"><label>${label}<br><small>${key==='position'?'meters':key==='rotation'?'degrees':''}</small></label><div class="${mixed?'mixed':''}">${input}</div></div>`}).join('')+'</div>';document.querySelectorAll('#fields [data-key]').forEach(el=>el.onchange=()=>{const key=el.dataset.key;targets.forEach(t=>{base.has(t.id+key)||base.set(t.id+key,structuredClone(t[key]));let v=el.type==='checkbox'?el.checked:el.value;if(['position','rotation','scale'].includes(key))v=v.split(',').map(Number);if(el.type==='number')v=Number(v);t[key]=v});status('Applied to '+targets.length+' object(s)');renderTree()})}$('#reset').onclick=()=>{selected.forEach(x=>{const n=nodes.find(n=>n.id===x);schema.forEach(([,k])=>{const b=base.get(x+k);if(b!==undefined)n[k]=structuredClone(b)})});renderTree();status('Reset overrides')};$('#restore').onclick=$('#reset').onclick;let current=null,grid=true,trash=false,aid=10;const assets=[{id:'models',name:'Models',kind:'folder',parent:null},{id:'textures',name:'Textures',kind:'folder',parent:null},{id:'materials',name:'Materials',kind:'folder',parent:null},{id:'a1',name:'Robot.glb',kind:'model',parent:'models',deps:['t1','mat1']},{id:'t1',name:'Robot_BaseColor.ktx2',kind:'texture',parent:'textures',deps:[]},{id:'mat1',name:'Robot_Material',kind:'material',parent:'materials',deps:['t1']},{id:'anim',name:'Walk.anim',kind:'animation',parent:'models',deps:['a1']}];const tasks=[];function renderAssets(){const q=$('#search').value.toLowerCase(),kind=$('#filter').value;$('#folders').innerHTML='<b>Folders</b><div class="card" data-folder="">📁 All Assets</div>'+assets.filter(a=>a.kind==='folder'&&!a.deleted).map(a=>`<div class="card" data-folder="${a.id}">📁 ${a.name}</div>`).join('');document.querySelectorAll('[data-folder]').forEach(e=>e.onclick=()=>{current=e.dataset.folder||null;renderAssets()});const list=assets.filter(a=>(trash?!!a.deleted:!a.deleted)&&a.kind!=='folder'&&(!current||a.parent===current)&&(!kind||a.kind===kind)&&a.name.toLowerCase().includes(q));$('#assetView').className=grid?'grid':'list';$('#assetView').innerHTML=list.map(a=>`<div class="card ${a.sel?'sel':''}" data-asset="${a.id}"><div class="thumb">${a.kind==='model'?'📦':a.kind==='texture'?'🖼️':a.kind==='material'?'◈':'▶'}</div><div><b>${a.name}</b><div class="muted">${a.kind}</div></div>${grid?'':`<div>${(a.deps||[]).length} deps</div><div>${a.deleted?'Deleted':'Ready'}</div>`}</div>`).join('');document.querySelectorAll('[data-asset]').forEach(e=>{e.onclick=()=>{assets.forEach(a=>a.sel=a.id===e.dataset.asset);renderAssets()};e.ondblclick=()=>assetMenu(e.dataset.asset)});$('#tasks').innerHTML=tasks.map(t=>`<div class="task"><b>${t.name}</b><div>${t.state} · ${Math.round(t.progress*100)}%</div><div class="bar"><i style="width:${t.progress*100}%"></i></div></div>`).join('');renderInspector()}function assetMenu(x){const a=assets.find(a=>a.id===x),action=prompt('Action: rename / move / delete / restore / dependencies / references / reimport','dependencies');if(action==='rename'){const n=prompt('Name',a.name);if(n)a.name=n}else if(action==='move'){const p=prompt('Folder id',a.parent);if(p!=null)a.parent=p}else if(action==='delete')a.deleted=true;else if(action==='restore')a.deleted=false;else if(action==='dependencies')alert((a.deps||[]).map(id=>assets.find(x=>x.id===id)?.name).join('\n')||'No dependencies');else if(action==='references')alert(assets.filter(x=>x.deps?.includes(a.id)).map(x=>x.name).join('\n')||'No references');else if(action==='reimport'){a.overridePreserved=true;queue(a.name,a.id)}renderAssets()}function queue(name,assetId){const t={name,state:'queued',progress:0,assetId};tasks.unshift(t);renderAssets();const states=['reading','decoding','processing','uploading','complete'];let i=0;const timer=setInterval(()=>{t.state=states[i];t.progress=(i+1)/states.length;i++;renderAssets();if(i===states.length){clearInterval(timer);status('Import complete')}} ,350)}$('#newFolder').onclick=()=>{const name=prompt('Folder name','New Folder');if(name)assets.push({id:'f'+aid++,name,kind:'folder',parent:current});renderAssets()};$('#importBtn').onclick=()=>$('#file').click();$('#file').onchange=e=>[...e.target.files].forEach(f=>{const ext=f.name.split('.').pop().toLowerCase(),kind=['glb','gltf'].includes(ext)?'model':['png','jpg','jpeg','ktx2'].includes(ext)?'texture':'other',a={id:'a'+aid++,name:f.name,kind,parent:current,deps:[]};assets.push(a);queue(f.name,a.id)});$('#search').oninput=renderAssets;$('#filter').onchange=renderAssets;$('#toggleView').onclick=()=>{grid=!grid;renderAssets()};$('#trash').onclick=()=>{trash=!trash;$('#trash').textContent=trash?'Back to Assets':'Trash';renderAssets()};renderTree();renderAssets();</script></body></html>
