name: Clean SSGI DoF PR

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  clean-verify:
    if: ${{ github.head_ref == 'agent/fix-ssgi-dof-crash' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ssgi-dof-crash
          fetch-depth: 0

      - name: Restore unrelated files from main
        run: |
          git fetch origin main
          git checkout origin/main -- \
            UPSTREAM_MATRIX.md \
            apps/playground/src/main.ts \
            apps/playground/src/routes.ts \
            apps/playground/src/styles.css \
            packages/viewer/src/effects/customNodes.ts \
            tests/unit/presets.test.ts
          rm -f pnpm-lock.yaml

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm exec prettier --check packages/viewer/src/KyxosViewer.ts tests/e2e/ssgi-dof-diagnostic.spec.ts
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/ssgi-dof-diagnostic.spec.ts --project=chromium
        env:
          CI: true

      - name: Confirm narrow diff
        shell: bash
        run: |
          rm -f pnpm-lock.yaml
          git rm .github/workflows/clean-ssgi-dof-pr.yml
          changed=$(git diff --name-only origin/main | sort)
          expected=$(printf '%s\n' \
            packages/viewer/src/KyxosViewer.ts \
            tests/e2e/ssgi-dof-diagnostic.spec.ts | sort)
          echo "Changed files:"
          echo "$changed"
          test "$changed" = "$expected"

      - name: Commit cleaned branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove unrelated formatting changes"
          git push origin HEAD:agent/fix-ssgi-dof-crash
