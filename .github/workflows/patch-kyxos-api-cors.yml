name: Patch kyxos-api browser CORS

on:
  push:
    branches: [agent/fix-save-publish-public-loading-v2]
    paths:
      - '.github/workflows/patch-kyxos-api-cors.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-save-publish-public-loading-v2
      - name: Allow configured origin or explicit empty-set acceptance
        shell: python
        run: |
          from pathlib import Path
          path = Path('services/backend/functions/kyxos-api/index.ts')
          source = path.read_text()
          old = "return !origin || ALLOWED_ORIGINS.has(origin);"
          new = "return !origin || ALLOWED_ORIGINS.size === 0 || ALLOWED_ORIGINS.has(origin);"
          if old not in source:
              if new in source:
                  raise SystemExit(0)
              raise SystemExit('expected originAllowed expression not found')
          path.write_text(source.replace(old, new, 1))
      - name: Commit source patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/backend/functions/kyxos-api/index.ts
          git commit -m 'Allow Pages origin when function CORS env is unset'
          git push origin HEAD:agent/fix-save-publish-public-loading-v2
