name: Apply standalone camera white-flash fix

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  apply-verify-publish:
    if: ${{ github.head_ref == 'agent/fix-traa-dof-camera-flash' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-traa-dof-camera-flash
          fetch-depth: 0

      - name: Apply camera-gesture flash fix and regression
        run: python scripts/apply-standalone-camera-white-flash-fix.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium

      - name: Verify standalone camera-motion white-flash regression
        run: pnpm exec playwright test tests/e2e/playground.spec.ts --project=chromium --grep "standalone TRAA and depth of field do not flash white"
        env:
          CI: true

      - name: Upload diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: standalone-camera-white-flash-diagnostics
          if-no-files-found: ignore
          path: |
            test-results
            playwright-report

      - name: Commit verified fix and remove bootstrap files
        shell: bash
        run: |
          rm .github/workflows/apply-standalone-camera-white-flash-fix.yml \
            scripts/apply-standalone-camera-white-flash-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/viewer/src/KyxosViewer.ts tests/e2e/playground.spec.ts \
            .github/workflows/apply-standalone-camera-white-flash-fix.yml \
            scripts/apply-standalone-camera-white-flash-fix.py
          git commit -m "fix: prevent standalone TRAA and DoF camera-end white flashes"
          git push origin HEAD:agent/fix-traa-dof-camera-flash
