name: CI and Pages

on:
  push:
    branches: [main, feat/webgpu-realism-complete]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_acceptance:
        description: Run the complete lifecycle release gate
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyxos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - name: Typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck 2>&1 | tee typecheck.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload typecheck diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-diagnostics
          path: typecheck.log
      - name: Unit tests
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee unit-test.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload unit test diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-diagnostics
          path: unit-test.log
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser acceptance
        shell: bash
        env:
          CI: true
        run: |
          set +e
          pnpm test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          path: |
            e2e.log
            test-results
            playwright-report
      - name: Full lifecycle acceptance
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/webgpu-realism-complete') || (github.event_name == 'workflow_dispatch' && inputs.full_acceptance) }}
        run: pnpm test:e2e --grep "specified resource stability counts"
        env:
          CI: true
          FULL_ACCEPTANCE: 1
      - name: Build Pages artifact
        run: PAGES_BUILD=1 pnpm build:pages

      - name: Checkout preserved Kyxos Studio preview
        uses: actions/checkout@v4
        with:
          ref: agent/kyxos-studio-playcanvas-editor-complete
          path: studio-preview-src

      - name: Build preserved Kyxos Studio preview
        working-directory: studio-preview-src
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @kyxos/studio build

      - name: Preserve Studio in every Pages artifact
        shell: bash
        run: |
          rm -rf site/studio site/preview/pr-12/studio
          mkdir -p site/studio site/preview/pr-12/studio
          cp -R studio-preview-src/apps/studio/dist/. site/studio/
          cp -R studio-preview-src/apps/studio/dist/. site/preview/pr-12/studio/
          test -f site/studio/index.html
          test -f site/preview/pr-12/studio/index.html
          grep -q "Kyxos Studio" site/studio/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  stable-tag:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish v1.0.0 tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = 'v1.0.0';
            try {
              await github.rest.git.getRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `tags/${tag}`,
              });
              core.info(`${tag} already exists; leaving it unchanged.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              core.info(`Published ${tag} at ${context.sha}.`);
            }
