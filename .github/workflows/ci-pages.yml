name: CI, Studio Preview and Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyxos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - name: Automated gates
        shell: bash
        run: |
          set +e
          pnpm verify 2>&1 | tee verify.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload verification diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-diagnostics
          path: verify.log
      - run: pnpm exec playwright install --with-deps chromium
      - name: WebGL 2 and WebGPU browser acceptance
        shell: bash
        env:
          CI: true
          KYXOS_WEBGPU_E2E: '1'
        run: |
          set +e
          pnpm test:e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Visual evidence
        if: ${{ github.event_name == 'pull_request' }}
        env:
          CI: true
        run: pnpm test:visual
      - name: Upload browser diagnostics and evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-acceptance
          if-no-files-found: ignore
          path: |
            e2e.log
            test-results
            playwright-report
            playwright-visual-report
      - name: Build Pages artifact and size report
        run: PAGES_BUILD=1 pnpm build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: kyxos-build-report
          path: site/build-report.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Kyxos Viewer, Studio, Public Viewer and Embed
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Skip when production Supabase secrets are not configured
        if: ${{ env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_PROJECT_ID == '' }}
        run: echo 'Supabase deployment secrets are not configured; Pages remains on the local acceptance provider.'
      - name: Prepare Supabase CLI project
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        working-directory: services/backend
        run: |
          rm -rf supabase
          mkdir -p supabase
          cp local/config.toml supabase/config.toml
          cp -R migrations supabase/migrations
          cp -R functions supabase/functions
          cp seed/seed.sql supabase/seed.sql
      - name: Link, lint and migrate database
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        working-directory: services/backend
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db lint --linked
          supabase db push --linked --include-seed
      - name: Deploy authenticated API
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        working-directory: services/backend
        run: supabase functions deploy kyxos-api --project-ref "$SUPABASE_PROJECT_ID"
      - name: Deploy anonymous immutable scene resolver
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_PROJECT_ID != '' }}
        working-directory: services/backend
        run: supabase functions deploy public-scene --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"
