name: CI, Studio Preview and Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyxos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm e2e
      - run: pnpm test:rls
      - name: Validate optional live Supabase configuration
        env:
          KYXOS_SUPABASE_URL: ${{ secrets.KYXOS_SUPABASE_URL }}
          KYXOS_SUPABASE_ANON_KEY: ${{ secrets.KYXOS_SUPABASE_ANON_KEY }}
          KYXOS_OWNER_EMAIL: ${{ secrets.KYXOS_OWNER_EMAIL }}
          KYXOS_OWNER_PASSWORD: ${{ secrets.KYXOS_OWNER_PASSWORD }}
          KYXOS_VIEWER_EMAIL: ${{ secrets.KYXOS_VIEWER_EMAIL }}
          KYXOS_VIEWER_PASSWORD: ${{ secrets.KYXOS_VIEWER_PASSWORD }}
        run: |
          required=(
            KYXOS_SUPABASE_URL
            KYXOS_SUPABASE_ANON_KEY
            KYXOS_OWNER_EMAIL
            KYXOS_OWNER_PASSWORD
            KYXOS_VIEWER_EMAIL
            KYXOS_VIEWER_PASSWORD
          )
          missing=()
          for key in "${required[@]}"; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Live Supabase acceptance is conditional: missing ${missing[*]}"
            exit 0
          fi
          pnpm test:rls:live
      - run: pnpm build
      - name: Install Chromium
        if: github.event_name == 'pull_request'
        run: pnpm exec playwright install --with-deps chromium
      - name: Run full browser acceptance
        if: github.event_name == 'pull_request'
        run: pnpm e2e:full
      - name: Upload browser evidence
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          if-no-files-found: ignore
          path: |
            playwright-report
            test-results
            visual-evidence
      - name: Report backend readiness
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_REF" ]; then
            echo "Supabase deployment credentials detected. Backend deployment job is enabled."
          else
            echo "Supabase deployment credentials are not configured; static Pages acceptance remains available."
          fi

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-backend:
    if: >-
      github.ref == 'refs/heads/main' &&
      secrets.SUPABASE_ACCESS_TOKEN != '' &&
      secrets.SUPABASE_PROJECT_REF != ''
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: supabase-production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Push database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"
      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          for function in create-upload complete-upload publish-scene disable-public; do
            supabase functions deploy "$function" --project-ref "$SUPABASE_PROJECT_REF"
          done
