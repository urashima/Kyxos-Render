name: CI and Pages

on:
  push:
    branches: [main, feat/webgpu-realism-complete]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kyxos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-navigator-feature-check:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/render-activity-state-machine' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-activity-state-machine
          fetch-depth: 0
      - name: Use DOM-compatible WebGPU feature detection
        run: sed -i "s/navigator\.gpu === undefined/!('gpu' in navigator)/" packages/viewer/src/KyxosViewer.ts
      - name: Restore standard CI and commit
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci-pages.yml > .github/workflows/ci-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/viewer/src/KyxosViewer.ts .github/workflows/ci-pages.yml
          git commit -m "fix: use portable WebGPU feature detection"
          git push origin HEAD:agent/render-activity-state-machine

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
