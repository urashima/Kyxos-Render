name: CI and Pages

on:
  push:
    branches: [main, feat/webgpu-realism-complete]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kyxos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-webgpu-value-check:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'agent/render-activity-state-machine' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-activity-state-machine
          fetch-depth: 0
      - name: Detect undefined WebGPU without relying on property presence
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('packages/viewer/src/KyxosViewer.ts')
          source = path.read_text()
          old = "    const forceWebGL = this.backendPreference === 'webgl2' || !('gpu' in navigator);"
          new = "    const navigatorWithGpu = navigator as Navigator & { gpu?: unknown };\n    const forceWebGL =\n      this.backendPreference === 'webgl2' || navigatorWithGpu.gpu === undefined;"
          if source.count(old) != 1:
              raise SystemExit('Expected one WebGPU feature check to patch.')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Restore standard CI and commit
        run: |
          git fetch origin main
          git show origin/main:.github/workflows/ci-pages.yml > .github/workflows/ci-pages.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/viewer/src/KyxosViewer.ts .github/workflows/ci-pages.yml
          git commit -m "fix: detect undefined WebGPU capability values"
          git push origin HEAD:agent/render-activity-state-machine

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
