name: Apply render activity state machine

on:
  push:
    branches: [agent/render-activity-state-machine]

permissions:
  contents: write

concurrency:
  group: apply-render-activity-state-machine
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-activity-state-machine
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply focused source changes
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/apply-render-activity-state.mjs
          node /tmp/apply-render-activity-state.mjs

      - name: Verify implementation
        run: |
          pnpm install --no-frozen-lockfile
          pnpm format
          pnpm verify

      - name: Commit implementation
        shell: bash
        run: |
          rm .github/workflows/apply-render-activity-state.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add converging render activity state machine"
          git push origin HEAD:agent/render-activity-state-machine
