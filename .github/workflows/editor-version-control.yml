name: Editor Version Control

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'packages/editor-core/src/version-control.ts'
      - 'packages/editor-core/package.json'
      - 'tests/unit/editor-version-control.spec.ts'
      - '.github/workflows/editor-version-control.yml'

permissions:
  contents: read

concurrency:
  group: editor-version-control-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install workspace
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck Editor Core
        run: pnpm --filter @kyxos/editor-core typecheck
      - name: Run version control acceptance
        run: pnpm exec vitest run tests/unit/editor-version-control.spec.ts --reporter=verbose
