name: Apply WebGPU full stack restore

on:
  pull_request:
    branches: [main]
    types: [reopened]

permissions:
  contents: write

jobs:
  restore-verify-publish:
    if: ${{ github.head_ref == 'agent/fix-black-mrt-ssr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-black-mrt-ssr
          fetch-depth: 0

      - name: Apply restoration patch
        run: |
          python scripts/apply-webgpu-full-stack-restore.py
          python scripts/fix-webgpu-test-escape.py
          python scripts/fix-ssr-env-sampling.py
          python scripts/fix-ssr-stochastic-fallback.py
          python scripts/fix-webgpu-ci-adapter.py
          python scripts/isolate-webgpu-effect-tests.py
          python scripts/collect-webgpu-matrix-results.py
          python scripts/fix-low-preset-baseline.py
          python scripts/fix-low-preset-test.py

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium

      - name: Verify WebGL fallback remains visible
        run: pnpm exec playwright test tests/e2e/playground.spec.ts --project=chromium --grep "WebGL 2 medium mode renders visible final pixels"
        env:
          CI: true

      - name: Verify restored WebGPU effect matrix
        shell: bash
        run: |
          set +e
          pnpm exec playwright test tests/e2e/webgpu.spec.ts --project=chromium-webgpu 2>&1 | tee webgpu-restore-e2e.log
          status=${PIPESTATUS[0]}
          exit $status
        env:
          CI: true

      - name: Upload restoration diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-full-stack-diagnostics
          if-no-files-found: ignore
          path: |
            webgpu-restore-e2e.log
            test-results
            playwright-report

      - name: Commit verified full stack restoration
        shell: bash
        run: |
          rm .github/workflows/apply-webgpu-full-stack-restore.yml scripts/apply-webgpu-full-stack-restore.py scripts/fix-webgpu-test-escape.py scripts/fix-ssr-env-sampling.py scripts/fix-ssr-stochastic-fallback.py scripts/fix-beauty-pass-source.py scripts/fix-webgpu-ci-adapter.py scripts/isolate-webgpu-effect-tests.py scripts/collect-webgpu-matrix-results.py scripts/fix-low-preset-baseline.py scripts/fix-low-preset-test.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/viewer/src/KyxosViewer.ts packages/viewer/src/presets.ts playwright.config.ts tests/unit/presets.test.ts tests/e2e/webgpu.spec.ts .github/workflows/apply-webgpu-full-stack-restore.yml scripts/apply-webgpu-full-stack-restore.py scripts/fix-webgpu-test-escape.py scripts/fix-ssr-env-sampling.py scripts/fix-ssr-stochastic-fallback.py scripts/fix-beauty-pass-source.py scripts/fix-webgpu-ci-adapter.py scripts/isolate-webgpu-effect-tests.py scripts/collect-webgpu-matrix-results.py scripts/fix-low-preset-baseline.py scripts/fix-low-preset-test.py
          git commit -m "fix: restore full WebGPU post-processing stack"
          git push origin HEAD:agent/fix-black-mrt-ssr
