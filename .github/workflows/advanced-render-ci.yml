name: Advanced rendering CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: kyxos-advanced-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-advanced-rendering:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run advanced rendering unit acceptance
        run: pnpm exec vitest run tests/unit/truvis-render.spec.ts tests/unit/advanced-packed-webgpu.spec.ts tests/unit/viewer-ssr-environment.spec.ts tests/unit/advanced-scene-contract.spec.ts

      - name: Build production products
        run: pnpm build

      - name: Verify advanced production routes
        run: |
          test -f apps/playground/dist/index.html
          test -f apps/studio/dist/index.html
          grep -q "Kyxos Studio" apps/studio/dist/index.html
          grep -R -q "advanced-render" apps/playground/dist/assets apps/studio/dist/assets

      - name: Install Chromium for advanced lab acceptance
        run: pnpm exec playwright install --with-deps chromium

      - name: Run advanced lab browser acceptance
        run: pnpm exec playwright test tests/e2e/advanced-rendering.spec.ts --project=chromium

      - name: Run true WebGPU Hybrid RT acceptance
        env:
          KYXOS_WEBGPU_E2E: '1'
        run: pnpm exec playwright test tests/e2e/advanced-hybrid.webgpu.spec.ts --project=chromium-webgpu
