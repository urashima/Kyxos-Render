name: Advanced rendering CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: kyxos-advanced-render-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-advanced-rendering:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck workspace
        run: pnpm typecheck

      - name: Run advanced rendering unit acceptance
        run: pnpm exec vitest run tests/unit/truvis-render.spec.ts tests/unit/viewer-ssr-environment.spec.ts

      - name: Build production products
        run: pnpm build

      - name: Verify advanced production routes
        run: |
          test -f apps/playground/dist/index.html
          test -f apps/studio/dist/index.html
          grep -q "Kyxos Studio" apps/studio/dist/index.html
          grep -R -q "advanced-render" apps/playground/dist/assets apps/studio/dist/assets
