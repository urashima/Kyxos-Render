name: Studio GLB Import Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/pr32_arraybuffer_asset_patch.py'
      - '.github/workflows/studio-glb-import-smoke.yml'

permissions:
  contents: write

concurrency:
  group: studio-glb-import-smoke-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-cross-browser-assets:
    if: github.head_ref == 'agent/fix-save-publish-public-loading-v2'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Store asset bytes instead of Blob objects
        run: |
          if [ ! -f .github/scripts/pr32_arraybuffer_asset_patch.py ]; then
            echo 'Patch script already consumed.'
            exit 0
          fi
          python .github/scripts/pr32_arraybuffer_asset_patch.py
          rm .github/scripts/pr32_arraybuffer_asset_patch.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add packages/api-client/src/index.ts packages/api-client/src/legacyAssetRecovery.ts tests/e2e/studio-save-publish-public.spec.ts .github/scripts/pr32_arraybuffer_asset_patch.py
          git commit -m 'fix: store asset bytes portably in IndexedDB'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
