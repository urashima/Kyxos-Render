name: Apply isolated black-screen fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-verify-publish:
    if: github.head_ref == 'agent/fix-black-mrt-ssr'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-black-mrt-ssr
          fetch-depth: 0
      - run: python scripts/apply-black-screen-fix.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm verify
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --grep "WebGL 2 medium mode renders visible final pixels"
        env:
          CI: true
      - name: Commit verified fix and remove bootstrap files
        shell: bash
        run: |
          rm .github/workflows/apply-black-screen-fix.yml scripts/apply-black-screen-fix.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/viewer/src/KyxosViewer.ts tests/e2e/playground.spec.ts .github/workflows/apply-black-screen-fix.yml scripts/apply-black-screen-fix.py
          git commit -m "fix: restore MRT and SSR rendering"
          git push origin HEAD:agent/fix-black-mrt-ssr
