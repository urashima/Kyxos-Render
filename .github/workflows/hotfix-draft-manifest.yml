name: Hotfix draft persistence and asset manifests

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-draft-manifest.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_PROJECT_REF: nmifubpreaanbndgmiee

jobs:
  patch-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch persistent asset validation and manifests
        shell: python
        run: |
          from pathlib import Path

          api_path = Path('services/backend/functions/kyxos-api/index.ts')
          source = api_path.read_text()

          old_hashes = """function sceneAssetHashes(scene: any): string[] {
            return [...new Set(
              Object.values(scene?.assets ?? {}).map((asset: any) => String(asset.contentHash)),
            )];
          }
          """
          new_hashes = """function isPersistentSceneAsset(asset: any): boolean {
            const metadata = asset?.metadata ?? {};
            const id = String(asset?.id ?? '');
            const hash = String(asset?.contentHash ?? '');
            return (
              validHash(hash) &&
              metadata.embedded !== true &&
              !metadata.embeddedInAssetId &&
              asset?.storageType !== 'virtual' &&
              asset?.runtimeOnly !== true &&
              !id.startsWith('embedded-gltf-')
            );
          }

          function sceneAssetHashes(scene: any): string[] {
            return [...new Set(
              Object.values(scene?.assets ?? {})
                .filter(isPersistentSceneAsset)
                .map((asset: any) => String(asset.contentHash)),
            )];
          }
          """
          if old_hashes in source:
              source = source.replace(old_hashes, new_hashes, 1)
          elif 'function isPersistentSceneAsset(asset: any)' not in source:
              raise SystemExit('sceneAssetHashes block was not found')

          helper_marker = "async function signedUpload(\n"
          helper = """function describeError(error: unknown): string {
            if (error instanceof Error) return error.message;
            if (error && typeof error === 'object') {
              const record = error as Record<string, unknown>;
              const details = ['message', 'details', 'hint', 'code']
                .map((key) => record[key])
                .filter((value): value is string => typeof value === 'string' && value.length > 0);
              if (details.length) return [...new Set(details)].join(' · ');
              try {
                return JSON.stringify(error);
              } catch {
                return 'Unknown structured error.';
              }
            }
            return String(error);
          }

          """
          if 'function describeError(error: unknown)' not in source:
              if helper_marker not in source:
                  raise SystemExit('signedUpload marker was not found')
              source = source.replace(helper_marker, helper + helper_marker, 1)

          old_manifest = """    if (path === 'assets/manifest' && request.method === 'POST') {
            const body = await request.json();
            const ids = Array.isArray(body.assetIds)
              ? [...new Set(body.assetIds.map(String))].slice(0, 500)
              : [];
            if (!ids.length) return json(request, { assets: {} });
            const { data, error } = await userClient
              .from('assets')
              .select('*')
              .in('id', ids);
          """
          new_manifest = """    if (path === 'assets/manifest' && request.method === 'POST') {
            const body = await request.json();
            const requestedIds = Array.isArray(body.assetIds)
              ? [...new Set(body.assetIds.map(String))].slice(0, 500)
              : [];
            const ids = requestedIds.filter((id) =>
              /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(id)
            );
            if (!ids.length) return json(request, { assets: {} });
            const { data, error } = await userClient
              .from('assets')
              .select('*')
              .in('id', ids);
          """
          if old_manifest in source:
              source = source.replace(old_manifest, new_manifest, 1)
          elif 'const requestedIds = Array.isArray(body.assetIds)' not in source:
              raise SystemExit('assets/manifest block was not found')

          old_validation = """      if (
            assets.length !== hashes.length ||
            assets.some((asset: any) => asset.metadata_json?.completed !== true)
          ) {
            throw new Error('One or more assets are missing or incomplete.');
          }
          """
          new_validation = """      const completedHashes = new Set(
            assets
              .filter((asset: any) => asset.metadata_json?.completed === true)
              .map((asset: any) => String(asset.content_hash)),
          );
          const missingHashes = hashes.filter((hash) => !completedHashes.has(hash));
          if (missingHashes.length) {
            throw new Error(
              `Missing or incomplete persistent assets: ${missingHashes.join(', ')}`,
            );
          }
          """
          if old_validation in source:
              source = source.replace(old_validation, new_validation, 1)
          elif 'const missingHashes = hashes.filter' not in source:
              raise SystemExit('publish asset validation block was not found')

          source = source.replace(
              "    const raw = error instanceof Error ? error.message : String(error);",
              "    const raw = describeError(error);",
              1,
          )
          api_path.write_text(source)

          public_path = Path('services/backend/functions/public-scene/index.ts')
          public_source = public_path.read_text()
          old_expected = """function expectedAssetHashes(snapshot: any): Set<string> {
            return new Set(
              Object.values(snapshot?.assets ?? {})
                .map((asset: any) => String(asset.contentHash ?? ''))
                .filter((hash) => /^[a-f0-9]{64}$/.test(hash)),
            );
          }
          """
          new_expected = """function isPersistentSnapshotAsset(asset: any): boolean {
            const metadata = asset?.metadata ?? {};
            const id = String(asset?.id ?? '');
            const hash = String(asset?.contentHash ?? '');
            return (
              /^[a-f0-9]{64}$/.test(hash) &&
              metadata.embedded !== true &&
              !metadata.embeddedInAssetId &&
              asset?.storageType !== 'virtual' &&
              asset?.runtimeOnly !== true &&
              !id.startsWith('embedded-gltf-')
            );
          }

          function expectedAssetHashes(snapshot: any): Set<string> {
            return new Set(
              Object.values(snapshot?.assets ?? {})
                .filter(isPersistentSnapshotAsset)
                .map((asset: any) => String(asset.contentHash ?? '')),
            );
          }
          """
          if old_expected in public_source:
              public_source = public_source.replace(old_expected, new_expected, 1)
          elif 'function isPersistentSnapshotAsset(asset: any)' not in public_source:
              raise SystemExit('public expectedAssetHashes block was not found')
          public_path.write_text(public_source)

          migrations = Path('services/backend/migrations')
          migrations.mkdir(parents=True, exist_ok=True)

          mime_migration = migrations / '0007_allow_browser_glb_mime.sql'
          if not mime_migration.exists():
              mime_migration.write_text("""begin;

          update storage.buckets
          set allowed_mime_types = array[
            'model/gltf-binary',
            'model/gltf+json',
            'application/octet-stream',
            'image/png',
            'image/jpeg',
            'image/webp',
            'image/ktx2',
            'image/vnd.radiance',
            'image/x-exr'
          ]::text[]
          where id = 'kyxos-assets';

          commit;
          """)

          guard_migration = migrations / '0008_fix_editor_json_guard_record_fields.sql'
          if not guard_migration.exists():
              guard_migration.write_text("""begin;

          create or replace function public.validate_editor_json_payload()
          returns trigger
          language plpgsql
          set search_path = public
          as $$
          declare
            row_json jsonb;
            payload jsonb;
            payload_key text;
          begin
            row_json := to_jsonb(new);
            payload_key := case tg_table_name
              when 'scene_drafts' then 'contract_json'
              when 'project_workspaces' then 'workspace_json'
              when 'project_scenes' then 'contract_json'
              when 'project_templates' then 'template_json'
              when 'scene_checkpoints' then 'scene_snapshot'
              else null
            end;
            payload := case
              when payload_key is null then '{}'::jsonb
              else coalesce(row_json -> payload_key, '{}'::jsonb)
            end;
            if octet_length(payload::text) > 67108864 then
              raise exception 'editor JSON payload exceeds 64 MB';
            end if;
            if payload::text ~* '<script|javascript:|onerror\\s*=|onload\\s*=' then
              raise exception 'executable content is forbidden';
            end if;
            if payload::text ~* 'service[_-]?role|jwt[_-]?secret|access[_-]?token' then
              raise exception 'secrets are forbidden in editor documents';
            end if;
            return new;
          end
          $$;

          commit;
          """)

      - name: Verify patch
        shell: bash
        run: |
          grep -Fq 'function isPersistentSceneAsset(asset: any)' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'const missingHashes = hashes.filter' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'function isPersistentSnapshotAsset(asset: any)' services/backend/functions/public-scene/index.ts
          grep -Fq 'function describeError(error: unknown)' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'const requestedIds = Array.isArray(body.assetIds)' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'const raw = describeError(error);' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'row_json := to_jsonb(new);' services/backend/migrations/0008_fix_editor_json_guard_record_fields.sql
          grep -Fq 'application/octet-stream' services/backend/migrations/0007_allow_browser_glb_mime.sql

      - name: Commit canonical fix
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add services/backend/functions/kyxos-api/index.ts services/backend/functions/public-scene/index.ts services/backend/migrations/0007_allow_browser_glb_mime.sql services/backend/migrations/0008_fix_editor_json_guard_record_fields.sql
            git commit -m 'fix(backend): publish only persistent scene assets'
            git push origin HEAD:main
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is unavailable.' >&2
            exit 1
          }

      - name: Deploy Studio API
        working-directory: services/backend
        run: >-
          supabase functions deploy kyxos-api
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Deploy Public Scene API
        working-directory: services/backend
        run: >-
          supabase functions deploy public-scene
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api
          --no-verify-jwt

      - name: Verify anonymous boundaries
        shell: bash
        run: |
          private_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kyxos-api/projects"
          private_status=$(curl --silent --output /tmp/api.json --write-out '%{http_code}' \
            -H 'apikey: sb_publishable_n3-QCQTDrxydochYLA_81Q_d51HUenv' "$private_url")
          cat /tmp/api.json
          test "$private_status" = '401'

          public_url="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/public-scene"
          public_status=$(curl --silent --output /tmp/public.json --write-out '%{http_code}' "$public_url")
          cat /tmp/public.json
          test "$public_status" = '400'
