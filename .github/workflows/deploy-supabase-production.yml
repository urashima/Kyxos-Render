name: Deploy production Supabase

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'services/backend/**'
      - '.github/workflows/deploy-supabase-production.yml'

permissions:
  contents: write

concurrency:
  group: deploy-production-supabase
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Supabase deployment package
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify production package structure
        shell: bash
        run: |
          test -f services/backend/config.toml
          test -f services/backend/migrations/0001_kyxos_studio.sql
          test -f services/backend/migrations/0002_publish_asset_ownership.sql
          test -f services/backend/migrations/0003_editor_collaboration.sql
          test -f services/backend/migrations/0004_security_hardening.sql
          test -f services/backend/migrations/0005_public_rls_helpers.sql
          test -f services/backend/functions/kyxos-api/index.ts
          test -f services/backend/functions/public-scene/index.ts
          grep -q 'project_id = "nmifubpreaanbndgmiee"' services/backend/config.toml
          grep -q '\[functions.kyxos-api\]' services/backend/config.toml
          grep -q '\[functions.public-scene\]' services/backend/config.toml
          grep -q 'verify_jwt = false' services/backend/config.toml

  deploy:
    name: Migrate database and deploy Edge Functions
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/cloud-persistence-acceptance'
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    environment: production-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: nmifubpreaanbndgmiee
      SUPABASE_WORKDIR: services/backend
      KYXOS_SUPABASE_URL: https://nmifubpreaanbndgmiee.supabase.co
      KYXOS_SUPABASE_ANON_KEY: sb_publishable_n3-QCQTDrxydochYLA_81Q_d51HUenv
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Pass request JWT explicitly to Supabase Auth
        if: github.head_ref == 'agent/cloud-persistence-acceptance'
        shell: python
        run: |
          from pathlib import Path

          path = Path('services/backend/functions/kyxos-api/index.ts')
          source = path.read_text()
          old = """  const authHeader = request.headers.get('authorization') ?? '';
          const userClient = createClient(SUPABASE_URL, ANON_KEY, {
            global: { headers: { authorization: authHeader } },
          });
          const admin = createClient(SUPABASE_URL, SERVICE_ROLE_KEY);
          const {
            data: { user },
          } = await userClient.auth.getUser();
          """
          new = """  const authHeader = request.headers.get('authorization') ?? '';
          const accessToken = authHeader.replace(/^Bearer\\s+/i, '').trim();
          const userClient = createClient(SUPABASE_URL, ANON_KEY, {
            global: { headers: { Authorization: authHeader } },
          });
          const admin = createClient(SUPABASE_URL, SERVICE_ROLE_KEY);
          const {
            data: { user },
            error: authError,
          } = await userClient.auth.getUser(accessToken);
          """
          if old in source:
              source = source.replace(old, new, 1)
              source = source.replace(
                  "    if (!user) return json(request, { error: 'authentication required' }, 401);",
                  "    if (authError || !user) return json(request, { error: 'authentication required' }, 401);",
                  1,
              )
              path.write_text(source)
          elif 'auth.getUser(accessToken)' not in source:
              raise SystemExit('Expected authentication block was not found.')

      - name: Verify request JWT handling
        shell: bash
        run: |
          grep -q 'auth.getUser(accessToken)' services/backend/functions/kyxos-api/index.ts
          grep -q 'authError || !user' services/backend/functions/kyxos-api/index.ts

      - name: Commit request JWT fix
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Authentication source is already patched.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add services/backend/functions/kyxos-api/index.ts
            git commit -m 'fix(backend): validate request JWT explicitly'
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Require Supabase management credentials
        shell: bash
        run: |
          missing=()
          [[ -n "$SUPABASE_ACCESS_TOKEN" ]] || missing+=(SUPABASE_ACCESS_TOKEN)
          [[ -n "$SUPABASE_DB_PASSWORD" ]] || missing+=(SUPABASE_DB_PASSWORD)
          if (( ${#missing[@]} )); then
            echo "::error title=Supabase deployment credentials missing::Configure GitHub environment or repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: >-
          supabase link
          --project-ref "$SUPABASE_PROJECT_REF"
          --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push --yes

      - name: Configure Edge Function environment
        run: >-
          supabase secrets set
          KYXOS_ALLOWED_ORIGINS=https://urashima.github.io
          KYXOS_PUBLIC_ALLOWED_ORIGINS=https://urashima.github.io
          KYXOS_MAX_UPLOAD_BYTES=536870912
          --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy authenticated Studio API
        run: >-
          supabase functions deploy kyxos-api
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Deploy anonymous Public Viewer resolver
        run: >-
          supabase functions deploy public-scene
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt
          --use-api

      - name: Verify production database and functions
        shell: bash
        run: |
          base="${KYXOS_SUPABASE_URL%/}"
          function_base="$base/functions/v1"
          for attempt in $(seq 1 12); do
            projects_status=$(curl --silent --output /tmp/projects.json --write-out '%{http_code}' \
              -H "apikey: $KYXOS_SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $KYXOS_SUPABASE_ANON_KEY" \
              "$base/rest/v1/projects?select=id&limit=1")
            slugs_status=$(curl --silent --output /tmp/slugs.json --write-out '%{http_code}' \
              -H "apikey: $KYXOS_SUPABASE_ANON_KEY" \
              -H "Authorization: Bearer $KYXOS_SUPABASE_ANON_KEY" \
              "$base/rest/v1/public_slugs?select=slug&limit=1")
            api_status=$(curl --silent --output /tmp/api.json --write-out '%{http_code}' \
              -H "apikey: $KYXOS_SUPABASE_ANON_KEY" \
              "$function_base/kyxos-api/projects")
            public_status=$(curl --silent --output /tmp/public.json --write-out '%{http_code}' \
              "$function_base/public-scene")
            if [[ "$projects_status" == '200' && "$slugs_status" == '200' && \
                  ( "$api_status" == '401' || "$api_status" == '403' ) && \
                  "$public_status" == '400' ]]; then
              echo 'Production Supabase database and Edge Functions are ready.'
              exit 0
            fi
            sleep 5
          done

          echo "projects table: HTTP $projects_status"
          cat /tmp/projects.json || true
          echo "public_slugs table: HTTP $slugs_status"
          cat /tmp/slugs.json || true
          echo "kyxos-api: HTTP $api_status"
          cat /tmp/api.json || true
          echo "public-scene: HTTP $public_status"
          cat /tmp/public.json || true
          exit 1
