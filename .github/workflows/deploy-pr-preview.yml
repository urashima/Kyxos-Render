name: Deploy PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: kyxos-pages-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: https://urashima.github.io/Kyxos-Render/preview/pr-${{ github.event.pull_request.number }}/
    env:
      PREVIEW_ROUTE: preview/pr-${{ github.event.pull_request.number }}
      PREVIEW_URL: https://urashima.github.io/Kyxos-Render/preview/pr-${{ github.event.pull_request.number }}/
    steps:
      - name: Checkout accepted main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout pull request revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: preview-src

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build accepted main Pages site
        working-directory: main-src
        run: |
          pnpm install --no-frozen-lockfile
          PAGES_BUILD=1 pnpm build:pages

      - name: Build pull request preview
        working-directory: preview-src
        env:
          PAGES_BASE: /Kyxos-Render/${{ env.PREVIEW_ROUTE }}/latest/
        run: |
          pnpm install --no-frozen-lockfile
          PAGES_BUILD=1 pnpm build:pages

      - name: Compose accepted site and preview route
        shell: bash
        run: |
          rm -rf combined-site
          cp -R main-src/site combined-site
          mkdir -p "combined-site/${PREVIEW_ROUTE}"
          cp -R preview-src/site/. "combined-site/${PREVIEW_ROUTE}/"

      - name: Verify preview artifact structure
        run: |
          test -f combined-site/latest/index.html
          test -f "combined-site/${PREVIEW_ROUTE}/index.html"
          test -f "combined-site/${PREVIEW_ROUTE}/latest/ssgi/index.html"
          test -f "combined-site/${PREVIEW_ROUTE}/studio/index.html"
          test -f "combined-site/${PREVIEW_ROUTE}/s/kyxos-acceptance-scene/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site

      - name: Deploy combined Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed preview online
        shell: bash
        run: |
          rm -f preview-index.html preview-ssgi.html preview-studio.html preview-public.html
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location "${PREVIEW_URL}" --output preview-index.html && \
               curl --fail --silent --show-error --location "${PREVIEW_URL}latest/ssgi/" --output preview-ssgi.html && \
               curl --fail --silent --show-error --location "${PREVIEW_URL}studio/" --output preview-studio.html && \
               curl --fail --silent --show-error --location "${PREVIEW_URL}s/kyxos-acceptance-scene/" --output preview-public.html; then
              break
            fi
            rm -f preview-index.html preview-ssgi.html preview-studio.html preview-public.html
            sleep 5
          done
          test -s preview-index.html
          test -s preview-ssgi.html
          test -s preview-studio.html
          test -s preview-public.html
          grep -q "Kyxos Render" preview-index.html
          grep -q "Kyxos WebGPU Realism Lab" preview-ssgi.html
          grep -q "Kyxos Studio" preview-studio.html
          grep -q "Kyxos Public Viewer" preview-public.html

      - name: Publish preview link on pull request
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ env.PREVIEW_URL }}
        with:
          script: |
            const marker = '<!-- kyxos-pr-preview -->';
            const body = `${marker}\n### Online preview\n\n${process.env.PREVIEW_URL}\n\nUpdated from commit \`${context.payload.pull_request.head.sha}\`. Online smoke check passed.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
