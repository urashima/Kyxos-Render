name: Hotfix Kyxos API auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-kyxos-api-auth.yml'
      - 'services/backend/config.toml'
      - 'services/backend/functions/kyxos-api/index.ts'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_PROJECT_REF: nmifubpreaanbndgmiee

jobs:
  patch-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch request JWT handling and restore static entrypoint
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('services/backend/functions/kyxos-api/index.ts')
          source = source_path.read_text()

          if 'auth.getUser(accessToken)' not in source:
              anchor = "  const authHeader = request.headers.get('authorization') ?? '';"
              if anchor not in source:
                  raise SystemExit('Authorization header anchor was not found.')
              source = source.replace(
                  anchor,
                  anchor + "\n  const accessToken = authHeader.replace(/^Bearer\\s+/i, '').trim();",
                  1,
              )
              old_header = 'global: { headers: { authorization: authHeader } },'
              if old_header not in source:
                  raise SystemExit('Supabase global authorization header was not found.')
              source = source.replace(
                  old_header,
                  'global: { headers: { Authorization: authHeader } },',
                  1,
              )
              old_get_user = "    data: { user },\n  } = await userClient.auth.getUser();"
              if old_get_user not in source:
                  raise SystemExit('Supabase getUser call was not found.')
              source = source.replace(
                  old_get_user,
                  "    data: { user },\n    error: authError,\n  } = await userClient.auth.getUser(accessToken);",
                  1,
              )
              old_boundary = "    if (!user) return json(request, { error: 'authentication required' }, 401);"
              if old_boundary not in source:
                  raise SystemExit('Authentication boundary was not found.')
              source = source.replace(
                  old_boundary,
                  "    if (authError || !user) return json(request, { error: 'authentication required' }, 401);",
                  1,
              )
              source_path.write_text(source)

          config_path = Path('services/backend/config.toml')
          config = config_path.read_text()
          config = config.replace(
              'entrypoint = "./functions/kyxos-api/entrypoint.ts"',
              'entrypoint = "./functions/kyxos-api/index.ts"',
          )
          config_path.write_text(config)

      - name: Verify static authentication patch
        shell: bash
        run: |
          grep -q 'auth.getUser(accessToken)' services/backend/functions/kyxos-api/index.ts
          grep -q 'authError || !user' services/backend/functions/kyxos-api/index.ts
          grep -q 'entrypoint = "./functions/kyxos-api/index.ts"' services/backend/config.toml

      - name: Commit patched source
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add services/backend/functions/kyxos-api/index.ts services/backend/config.toml
            git commit -m 'fix(backend): validate request JWT explicitly'
            git push origin HEAD:main
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is unavailable.' >&2
            exit 1
          }

      - name: Deploy authenticated Studio API
        working-directory: services/backend
        run: >-
          supabase functions deploy kyxos-api
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Verify anonymous requests remain blocked
        shell: bash
        run: |
          status=$(curl --silent --output /tmp/api.json --write-out '%{http_code}' \
            -H 'apikey: sb_publishable_n3-QCQTDrxydochYLA_81Q_d51HUenv' \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kyxos-api/projects")
          cat /tmp/api.json
          test "$status" = '401'
