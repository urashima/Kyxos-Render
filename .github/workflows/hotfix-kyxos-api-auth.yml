name: Hotfix Kyxos API authenticated database client

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-kyxos-api-auth.yml'
      - 'services/backend/config.toml'
      - 'services/backend/functions/kyxos-api/index.ts'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_PROJECT_REF: nmifubpreaanbndgmiee

jobs:
  patch-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Force the validated JWT onto every Supabase data request
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('services/backend/functions/kyxos-api/index.ts')
          source = source_path.read_text()
          old = """  const userClient = createClient(SUPABASE_URL, ANON_KEY, {
            global: { headers: { Authorization: authHeader } },
          });
          """
          new = """  const userClient = createClient(SUPABASE_URL, ANON_KEY, {
            global: {
              fetch: (input, init = {}) => {
                const headers = new Headers(init.headers);
                headers.set('Authorization', `Bearer ${accessToken}`);
                headers.set('apikey', ANON_KEY);
                return fetch(input, { ...init, headers });
              },
            },
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false,
            },
          });
          """
          if old in source:
              source = source.replace(old, new, 1)
              source_path.write_text(source)
          elif "headers.set('Authorization', `Bearer ${accessToken}`);" not in source:
              raise SystemExit('Authenticated Supabase client block was not found.')

          config_path = Path('services/backend/config.toml')
          config = config_path.read_text().replace(
              'entrypoint = "./functions/kyxos-api/entrypoint.ts"',
              'entrypoint = "./functions/kyxos-api/index.ts"',
          )
          config_path.write_text(config)

      - name: Verify authenticated data client
        shell: bash
        run: |
          grep -Fq 'auth.getUser(accessToken)' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'headers.set('\''Authorization'\'', `Bearer ${accessToken}`);' services/backend/functions/kyxos-api/index.ts
          grep -Fq 'entrypoint = "./functions/kyxos-api/index.ts"' services/backend/config.toml

      - name: Commit patched source
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add services/backend/functions/kyxos-api/index.ts services/backend/config.toml
            git commit -m 'fix(backend): propagate request JWT to PostgREST'
            git push origin HEAD:main
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is unavailable.' >&2
            exit 1
          }

      - name: Deploy authenticated Studio API
        working-directory: services/backend
        run: >-
          supabase functions deploy kyxos-api
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Verify anonymous boundary and CORS
        shell: bash
        run: |
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kyxos-api/projects"
          status=$(curl --silent --output /tmp/api.json --write-out '%{http_code}' \
            -H 'apikey: sb_publishable_n3-QCQTDrxydochYLA_81Q_d51HUenv' "$base")
          cors_status=$(curl --silent --output /tmp/cors.json --write-out '%{http_code}' \
            -X OPTIONS -H 'Origin: https://urashima.github.io' \
            -H 'Access-Control-Request-Method: POST' "$base")
          cat /tmp/api.json
          test "$status" = '401'
          test "$cors_status" = '204'
