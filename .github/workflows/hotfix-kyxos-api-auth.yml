name: Hotfix Kyxos cloud persistence

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-kyxos-api-auth.yml'
      - 'services/backend/config.toml'
      - 'services/backend/functions/kyxos-api/index.ts'
      - 'services/backend/migrations/0006_atomic_project_creation.sql'
      - 'services/backend/migrations/0007_allow_browser_glb_mime.sql'
      - 'packages/api-client/src/index.ts'
      - 'apps/studio/src/main.ts'
  workflow_dispatch:

permissions:
  contents: write

env:
  SUPABASE_PROJECT_REF: nmifubpreaanbndgmiee

jobs:
  patch-deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    environment: production-supabase
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch stable cloud routes, GLB upload and Realtime
        shell: python
        run: |
          from pathlib import Path

          source_path = Path('services/backend/functions/kyxos-api/index.ts')
          source = source_path.read_text()

          client_start = source.index(
              "  const userClient = createClient(SUPABASE_URL, ANON_KEY, {"
          )
          client_end = source.index(
              "  const admin = createClient(SUPABASE_URL, SERVICE_ROLE_KEY);",
              client_start,
          )
          client = """  const userClient = createClient(SUPABASE_URL, ANON_KEY, {
            global: {
              headers: { Authorization: `Bearer ${accessToken}` },
              fetch: (input, init = {}) => {
                const headers = new Headers(
                  input instanceof Request ? input.headers : undefined,
                );
                new Headers(init.headers).forEach((value, name) => {
                  headers.set(name, value);
                });
                headers.set('Authorization', `Bearer ${accessToken}`);
                headers.set('apikey', ANON_KEY);
                return fetch(input, { ...init, headers });
              },
            },
            auth: {
              persistSession: false,
              autoRefreshToken: false,
              detectSessionInUrl: false,
            },
          });
          """
          source = source[:client_start] + client + source[client_end:]

          get_start = source.index(
              "    if (path === 'projects' && request.method === 'GET') {"
          )
          get_end = source.index(
              "\n    if (path === 'projects' && request.method === 'POST') {",
              get_start,
          )
          get_block = """    if (path === 'projects' && request.method === 'GET') {
            const ownedResult = await admin
              .from('projects')
              .select('*')
              .eq('owner_id', user.id)
              .eq('status', 'active');
            if (ownedResult.error) throw ownedResult.error;

            const membershipResult = await admin
              .from('project_members')
              .select('project_id')
              .eq('user_id', user.id);
            if (membershipResult.error) throw membershipResult.error;

            const memberIds = [...new Set(
              (membershipResult.data ?? []).map((row) => row.project_id),
            )];
            let sharedRows = [];
            if (memberIds.length) {
              const sharedResult = await admin
                .from('projects')
                .select('*')
                .in('id', memberIds)
                .eq('status', 'active');
              if (sharedResult.error) throw sharedResult.error;
              sharedRows = sharedResult.data ?? [];
            }

            const projects = [...new Map(
              [...(ownedResult.data ?? []), ...sharedRows]
                .map((row) => [row.id, row]),
            ).values()].sort(
              (a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at),
            );
            return json(request, projects.map(normalizeProject));
          }
          """
          source = source[:get_start] + get_block + source[get_end:]

          post_start = source.index(
              "    if (path === 'projects' && request.method === 'POST') {"
          )
          post_end = source.index("\n    const projectMatch =", post_start)
          post_block = """    if (path === 'projects' && request.method === 'POST') {
            const body = await request.json();
            const { data, error } = await admin.rpc('create_project_for_user', {
              target_user: user.id,
              project_name: safeName(String(body.name ?? 'Untitled Project')),
            });
            if (error) throw error;
            return json(request, normalizeProject(data), 201);
          }
          """
          source = source[:post_start] + post_block + source[post_end:]
          source_path.write_text(source)

          config_path = Path('services/backend/config.toml')
          config = config_path.read_text().replace(
              'entrypoint = "./functions/kyxos-api/entrypoint.ts"',
              'entrypoint = "./functions/kyxos-api/index.ts"',
          )
          config_path.write_text(config)

          api_path = Path('packages/api-client/src/index.ts')
          api = api_path.read_text()
          marker = 'export class SupabaseKyxosApiClient implements KyxosApiClient {'
          helper = '''function normalizedUploadContentType(file: Blob): string {
            const declared = file.type.trim().toLowerCase();
            if (typeof File !== 'undefined' && file instanceof File) {
              const extension = file.name.split('.').pop()?.toLowerCase() ?? '';
              const inferred = ({
                glb: 'model/gltf-binary',
                gltf: 'model/gltf+json',
                hdr: 'image/vnd.radiance',
                exr: 'image/x-exr',
                png: 'image/png',
                jpg: 'image/jpeg',
                jpeg: 'image/jpeg',
                webp: 'image/webp',
                ktx2: 'image/ktx2',
              } as Record<string, string>)[extension];
              if (inferred and (not declared or declared == 'application/octet-stream')):
                return inferred
            }
            return declared || 'application/octet-stream';
          }

          '''
          helper = helper.replace(
              "              if (inferred and (not declared or declared == 'application/octet-stream')):\n                return inferred\n",
              "              if (inferred && (!declared || declared === 'application/octet-stream')) return inferred;\n",
          )
          if 'function normalizedUploadContentType' not in api:
            api = api.replace(marker, helper + marker, 1)
          api = api.replace(
              '      this.realtimeClient.realtime.setAuth(this.token);\n      return {',
              '      await this.realtimeClient.realtime.setAuth(this.token);\n      return {',
              1,
          )
          api = api.replace(
              "      this.realtimeClient.realtime.setAuth();\n      sessionStorage.removeItem('kyxos-token');",
              "      await this.realtimeClient.realtime.setAuth();\n      sessionStorage.removeItem('kyxos-token');",
              1,
          )
          api = api.replace(
              '      const user = await response.json();\n      return { userId: user.id, email: user.email, accessToken: this.token };',
              '      const user = await response.json();\n      await this.realtimeClient.realtime.setAuth(this.token);\n      return { userId: user.id, email: user.email, accessToken: this.token };',
              1,
          )
          api = api.replace(
              '      this.realtimeClient.realtime.setAuth(this.token);\n      const channel =',
              '      await this.realtimeClient.realtime.setAuth(this.token);\n      const channel =',
              1,
          )
          api = api.replace(
              "        const timeout = window.setTimeout(() => reject(new Error('Realtime connection timed out.')), 10_000);",
              """        const timeout = window.setTimeout(() => {
            void this.realtimeClient.removeChannel(channel);
            reject(new Error('Realtime connection timed out.'));
          }, 20_000);""",
              1,
          )
          old_upload = """      const { error } = await this.realtimeClient.storage
            .from('kyxos-assets')
            .uploadToSignedUrl(ticket.storageKey, ticket.uploadToken, file, {
              cacheControl: '31536000',
              contentType: file.type || 'application/octet-stream',
            });"""
          new_upload = """      const contentType = normalizedUploadContentType(file);
          const uploadBody = file.type === contentType
            ? file
            : file.slice(0, file.size, contentType);
          const { error } = await this.realtimeClient.storage
            .from('kyxos-assets')
            .uploadToSignedUrl(ticket.storageKey, ticket.uploadToken, uploadBody, {
              cacheControl: '31536000',
              contentType,
            });"""
          if old_upload in api:
            api = api.replace(old_upload, new_upload, 1)
          api_path.write_text(api)

          studio_path = Path('apps/studio/src/main.ts')
          studio = studio_path.read_text()
          studio = studio.replace(
              'mimeType: file.type || mimeFor(extension),',
              'mimeType: mimeFor(extension),',
          )
          studio = studio.replace(
              "mimeType: file.type || 'model/gltf-binary',",
              "mimeType: 'model/gltf-binary',",
          )
          studio = studio.replace(
              "      if (generation === collaborationGeneration) showNotice(`Realtime offline: ${errorMessage(error)}`, true);",
              """      if (generation === collaborationGeneration) {
            showNotice(`Realtime unavailable; editing and uploads remain available. ${errorMessage(error)}`);
          }""",
              1,
          )
          studio_path.write_text(studio)

          migration_path = Path('services/backend/migrations/0007_allow_browser_glb_mime.sql')
          if not migration_path.exists():
            migration_path.write_text("""begin;

update storage.buckets
set allowed_mime_types = array[
  'model/gltf-binary',
  'model/gltf+json',
  'application/octet-stream',
  'image/png',
  'image/jpeg',
  'image/webp',
  'image/ktx2',
  'image/vnd.radiance',
  'image/x-exr'
]::text[]
where id = 'kyxos-assets';

commit;
""")

      - name: Verify source patch
        shell: bash
        run: |
          ! grep -Fq 'accessToken: async () => accessToken' services/backend/functions/kyxos-api/index.ts
          grep -Fq "input instanceof Request ? input.headers : undefined" services/backend/functions/kyxos-api/index.ts
          grep -Fq ".eq('owner_id', user.id)" services/backend/functions/kyxos-api/index.ts
          grep -Fq "admin.rpc('create_project_for_user'" services/backend/functions/kyxos-api/index.ts
          grep -Fq 'entrypoint = "./functions/kyxos-api/index.ts"' services/backend/config.toml
          grep -Fq 'function normalizedUploadContentType' packages/api-client/src/index.ts
          grep -Fq 'await this.realtimeClient.realtime.setAuth(this.token)' packages/api-client/src/index.ts
          grep -Fq 'uploadToSignedUrl(ticket.storageKey, ticket.uploadToken, uploadBody' packages/api-client/src/index.ts
          grep -Fq 'mimeType: mimeFor(extension)' apps/studio/src/main.ts
          grep -Fq 'application/octet-stream' services/backend/migrations/0007_allow_browser_glb_mime.sql

      - name: Commit patched source
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add \
              services/backend/functions/kyxos-api/index.ts \
              services/backend/config.toml \
              services/backend/migrations/0007_allow_browser_glb_mime.sql \
              packages/api-client/src/index.ts \
              apps/studio/src/main.ts
            git commit -m 'fix(studio): normalize GLB MIME and await Realtime auth'
            git push origin HEAD:main
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Require deployment credentials
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || {
            echo 'SUPABASE_ACCESS_TOKEN is unavailable.' >&2
            exit 1
          }

      - name: Deploy authenticated Studio API
        working-directory: services/backend
        run: >-
          supabase functions deploy kyxos-api
          --project-ref "$SUPABASE_PROJECT_REF"
          --use-api

      - name: Verify anonymous boundary and CORS
        shell: bash
        run: |
          base="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/kyxos-api/projects"
          status=$(curl --silent --output /tmp/api.json --write-out '%{http_code}' \
            -H 'apikey: sb_publishable_n3-QCQTDrxydochYLA_81Q_d51HUenv' "$base")
          cors_status=$(curl --silent --output /tmp/cors.json --write-out '%{http_code}' \
            -X OPTIONS -H 'Origin: https://urashima.github.io' \
            -H 'Access-Control-Request-Method: POST' "$base")
          cat /tmp/api.json
          test "$status" = '401'
          test "$cors_status" = '204'
