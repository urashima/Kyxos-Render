name: PR32 Cloud Backend Patch

on:
  push:
    branches: [agent/fix-save-publish-public-loading-v2]
    paths:
      - '.github/scripts/pr32_remote_backend_patch.py'
      - '.github/workflows/pr32-remote-backend-patch.yml'

permissions:
  contents: write

concurrency:
  group: pr32-cloud-backend-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-save-publish-public-loading-v2
          fetch-depth: 0
      - name: Apply cloud backend patch
        run: |
          python .github/scripts/pr32_remote_backend_patch.py
          rm .github/scripts/pr32_remote_backend_patch.py
          rm .github/workflows/pr32-remote-backend-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/studio/src/main.ts apps/public-viewer/src/main.ts packages/api-client/src/index.ts docs/DEPLOYMENT.md tests/unit/runtime-backend-config.spec.ts .github/workflows/deploy-main-pages.yml .github/workflows/deploy-pr-preview.yml .github/workflows/studio-glb-import-smoke.yml .github/scripts/pr32_remote_backend_patch.py .github/workflows/pr32-remote-backend-patch.yml
          git commit -m 'fix: require cloud persistence for production publishing'
          git push origin HEAD:agent/fix-save-publish-public-loading-v2
