name: Diagnose SSGI DoF crash

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'agent/fix-ssgi-dof-crash' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ssgi-dof-crash
      - name: Apply explicit DoF input RTT fix
        run: python scripts/apply-ssgi-dof-rtt-fix.py
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium

      - name: Verify SSGI and DoF combinations on WebGL fallback
        shell: bash
        run: |
          set +e
          pnpm exec playwright test tests/e2e/ssgi-dof-diagnostic.spec.ts --project=chromium 2>&1 | tee ssgi-dof-webgl.log
          status=${PIPESTATUS[0]}
          echo $status > webgl.status
          exit $status
        env:
          CI: true

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ssgi-dof-crash-diagnostics
          if-no-files-found: ignore
          path: |
            ssgi-dof-webgl.log
            webgl.status
            test-results
            playwright-report
