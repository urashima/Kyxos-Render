name: Diagnose SSGI DoF crash

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  diagnose:
    if: ${{ github.head_ref == 'agent/fix-ssgi-dof-crash' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-ssgi-dof-crash
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm format
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium

      - name: Reproduce on WebGL fallback
        shell: bash
        run: |
          set +e
          pnpm exec playwright test tests/e2e/ssgi-dof-diagnostic.spec.ts --project=chromium 2>&1 | tee ssgi-dof-webgl.log
          echo ${PIPESTATUS[0]} > webgl.status
        env:
          CI: true

      - name: Reproduce on Chromium WebGPU software adapter
        shell: bash
        run: |
          set +e
          KYXOS_WEBGPU_E2E=1 pnpm exec playwright test tests/e2e/ssgi-dof-diagnostic.spec.ts --project=chromium-webgpu 2>&1 | tee ssgi-dof-webgpu.log
          echo ${PIPESTATUS[0]} > webgpu.status
        env:
          CI: true

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ssgi-dof-crash-diagnostics
          if-no-files-found: ignore
          path: |
            ssgi-dof-webgl.log
            ssgi-dof-webgpu.log
            webgl.status
            webgpu.status
            test-results
            playwright-report

      - name: Report reproduction result
        shell: bash
        run: |
          webgl=$(cat webgl.status)
          webgpu=$(cat webgpu.status)
          echo "WebGL status: $webgl"
          echo "WebGPU status: $webgpu"
          test "$webgl" = "0"
