name: Deploy black-screen fix preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: kyxos-pages-preview-fix-black-mrt-ssr
  cancel-in-progress: true

jobs:
  deploy-preview:
    if: ${{ github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/fix-black-mrt-ssr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/fix-black-mrt-ssr/
    steps:
      - name: Checkout accepted main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-src

      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: preview-src

      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build accepted main Pages site
        working-directory: main-src
        run: |
          pnpm install --no-frozen-lockfile
          PAGES_BUILD=1 pnpm build:pages

      - name: Build isolated fix preview
        working-directory: preview-src
        env:
          PAGES_BASE: /Kyxos-Render/preview/fix-black-mrt-ssr/
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Compose accepted site and preview route
        shell: bash
        run: |
          rm -rf combined-site
          cp -R main-src/site combined-site
          mkdir -p combined-site/preview/fix-black-mrt-ssr
          cp -R preview-src/apps/playground/dist/. combined-site/preview/fix-black-mrt-ssr/
          node <<'NODE'
          const { copyFile, mkdir } = require('node:fs/promises');
          const { resolve } = require('node:path');
          const root = resolve('combined-site/preview/fix-black-mrt-ssr');
          const routes = [
            'overview', 'pbr', 'buffers', 'aa', 'traa', 'temporal', 'gtao', 'ssao', 'ssr', 'ssgi',
            'motion-blur', 'denoise', 'sharpness', 'lens-distortion', 'background', 'sparkle',
            'full-stack', 'performance', 'lifecycle',
          ];
          (async () => {
            for (const route of routes) {
              const target = resolve(root, route);
              await mkdir(target, { recursive: true });
              await copyFile(resolve(root, 'index.html'), resolve(target, 'index.html'));
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Verify preview artifact structure
        run: |
          test -f combined-site/latest/index.html
          test -f combined-site/preview/fix-black-mrt-ssr/index.html
          test -f combined-site/preview/fix-black-mrt-ssr/full-stack/index.html
          grep -R "/Kyxos-Render/preview/fix-black-mrt-ssr/" combined-site/preview/fix-black-mrt-ssr/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: combined-site

      - name: Deploy combined Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
